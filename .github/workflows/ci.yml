name: CI

# Each push and pull request: every check of the app and its crates, on
# Linux only. To test Windows and macOS too, and chummyd, run "CI (all
# systems)" (ci-all.yml) from the Actions tab; chummyd alone: "chummyd"
# (chummyd.yml).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      # Same Ubuntu as the Linux release build (release.yml).
      oses: '["ubuntu-24.04"]'
