name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:ui
      - run: npm run build

  engine:
    name: Built-in engine (Python tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s crates/local/engine -v
      - name: Built-in tools (logic, on the host Python)
        run: python -m unittest discover -s crates/tools/tests -p 'test_*.py' -v

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev

      # rustup reads rust-toolchain.toml, so this installs the pinned version.
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tauri::generate_context! embeds the built frontend.
      - run: npm run build

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The sandbox tests run real tools on the real WebAssembly Python.
      - name: WebAssembly Python for the tool sandbox tests
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/python-wasi.zip" \
            https://github.com/brettcannon/cpython-wasi-build/releases/download/v3.14.7/python-3.14.7-wasi_sdk-24.zip
          echo "CHUMMY_TEST_PYTHON_ZIP=$RUNNER_TEMP/python-wasi.zip" >> "$GITHUB_ENV"
          echo "CHUMMY_TEST_PYPI=1" >> "$GITHUB_ENV"
      # The Container sandbox test runs real tools in real Docker containers.
      - name: Docker image for the container sandbox test
        if: runner.os == 'Linux'
        run: |
          docker pull python:3.14-slim
          echo "CHUMMY_TEST_DOCKER_IMAGE=python:3.14-slim" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --workspace --locked
