name: Set version

# Started by hand (Actions → Set version → Run workflow): writes a version
# into every file that records it (scripts/set-version.mjs) and commits that
# to the chosen branch. Use it after a release to bring the repository up to
# the release's tag. (Releases set the version from their tag themselves.)
#
# Its commit is made with the workflow's own token, which GitHub doesn't let
# start other workflows, so CI doesn't run on it (only version numbers change).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like v0.1.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: set-version-${{ github.ref }}

jobs:
  set:
    name: Set the version to ${{ inputs.version }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write it into every file
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/set-version.mjs "$VERSION"
      - name: Commit and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git diff --quiet; then
            echo "The files already say ${VERSION#v}; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Set the version to ${VERSION#v}"
          git push
