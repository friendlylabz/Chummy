name: WASI Python

# Builds the Python that tools run on (scripts/build-wasi-python.sh) and
# uploads it as the "wasi-python" artifact. CI reuses a cached build while
# the script is unchanged; releases always build fresh.

on:
  workflow_call:
    inputs:
      fresh:
        description: "Build even if a cached build exists"
        type: boolean
        default: false
      attest:
        description: "Sign a build provenance attestation for the zip (needs id-token and attestations write)"
        type: boolean
        default: false

# No permissions block here on purpose: a called workflow's own block caps
# its token, which took away the id-token and attestations permissions the
# release grants for the attestation ("Unable to get
# ACTIONS_ID_TOKEN_REQUEST_URL"). Each caller sets what it needs: CI
# contents: read; the release adds id-token and attestations write.

jobs:
  build:
    name: Build Python for WASI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cached build
        id: cache
        if: ${{ !inputs.fresh }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wasi-python
          key: wasi-python-${{ hashFiles('scripts/build-wasi-python.sh') }}

      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libffi-dev zip unzip xz-utils python3-venv

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-wasi-python.sh

      - run: cat wasi-python/build-info.txt

      # Lets anyone check the zip came from this workflow:
      #   gh attestation verify python-wasi.zip --repo friendlylabz/Chummy
      - name: Attest build provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: wasi-python/python-wasi.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasi-python
          path: wasi-python/
          if-no-files-found: error
