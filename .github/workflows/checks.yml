name: Checks

# Every check CI runs, on the systems the caller picks. Called by ci.yml
# (each push and pull request: Linux only) and ci-all.yml (started by hand:
# Linux, Windows and macOS).

on:
  workflow_call:
    inputs:
      oses:
        description: 'JSON list of runners for the Rust job, e.g. ["ubuntu-22.04"]'
        type: string
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tools' Python (scripts/build-wasi-python.sh), cached while the
  # script is unchanged. The Rust jobs embed it and test tools on it.
  wasi-python:
    name: Python for WASI
    uses: ./.github/workflows/wasi-python.yml
    permissions:
      contents: read

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:ui
      - run: npm run build

  engine:
    name: Built-in engine (Python tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s crates/local/engine -v
      - name: Built-in tools (logic, on the host Python)
        run: python -m unittest discover -s crates/tools/tests -p 'test_*.py' -v

  rust:
    name: Rust (${{ matrix.os }})
    needs: wasi-python
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oses) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tools' Python (embedded in the app; the sandbox tests run real tools on it)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasi-python
          path: wasi-python
      - name: Point the tests at it
        shell: bash
        run: |
          echo "CHUMMY_TEST_PYTHON_ZIP=$GITHUB_WORKSPACE/wasi-python/python-wasi.zip" >> "$GITHUB_ENV"
          echo "CHUMMY_TEST_PYPI=1" >> "$GITHUB_ENV"
          echo "CHUMMY_REQUIRE_BUNDLED_PYTHON=1" >> "$GITHUB_ENV"

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev

      # rustup reads rust-toolchain.toml, so this installs the pinned version.
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # tauri::generate_context! embeds the built frontend.
      - run: npm run build

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The Container sandbox test runs real tools in real Docker containers.
      - name: Docker image for the container sandbox test
        if: runner.os == 'Linux'
        run: |
          docker pull python:3.14-slim
          echo "CHUMMY_TEST_DOCKER_IMAGE=python:3.14-slim" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --workspace --locked
      # chummyd runs agents with the app's own crates, but never with Tauri
      # or a webview.
      - name: chummyd doesn't depend on Tauri
        if: runner.os == 'Linux'
        run: |
          if cargo tree -p chummyd -e normal --locked --prefix none | grep -iE '^(tauri|wry|webkit2gtk)'; then
            echo "chummyd must not depend on Tauri" >&2
            exit 1
          fi
      # Real HTTPS to github.com and PyPI with the operating system checking
      # certificates (Windows fetches missing root certificates on demand).
      - name: HTTPS with the OS certificate verifier
        run: cargo test -p chummy-http --locked -- --ignored
      # Apple Silicon kills apps under the hardened runtime that run JIT code
      # without these entitlements ("Code Signature Invalid"; v0.1.0 crashed
      # setting up tools). Intel Macs don't enforce it, so this runner can
      # only check that the signed app works with Entitlements.plist.
      - name: macOS hardened runtime with the JIT entitlements
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo build -p chummy --locked
          bin=target/debug/chummy
          codesign --force -o runtime --entitlements src-tauri/Entitlements.plist -s - "$bin"
          "$bin" --self-test
