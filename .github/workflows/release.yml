name: Release

# Builds installers for every platform and publishes them as a GitHub
# release. Start it either way:
#   - push a tag like v0.1.0, or
#   - Actions → Release → Run workflow, and type the version (the tag is
#     created on the chosen branch's latest commit).
# The release stays a draft while building and is published only when every
# platform built.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release (becomes the tag), like v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS builds run on the Intel runner (Apple Silicon is
          # cross-compiled): GitHub's arm64 macOS runners have been too busy
          # to pick up jobs at all.
          - name: macOS (Apple Silicon)
            os: macos-15-intel
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-15-intel
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
            target: ""
          - name: Windows
            os: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          if [ -n "${{ matrix.target }}" ]; then rustup target add ${{ matrix.target }}; fi
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Chummy ${{ inputs.tag || github.ref_name }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            **Chummy is a heavy work in progress, and 100% vibe-coded.** Expect rough edges.

            Download the file for your computer below:

            - **Windows:** `Chummy_…_x64-setup.exe`. If Windows says it protected your PC, click **More info → Run anyway** (the app isn't signed yet).
            - **Mac with Apple Silicon (M1 and newer):** `Chummy_…_aarch64.dmg`. **Intel Mac:** `Chummy_…_x64.dmg`. Drag Chummy to Applications. The first time, macOS refuses to open it (not notarized yet): go to **System Settings → Privacy & Security** and click **Open Anyway**.
            - **Linux:** `Chummy_…_amd64.AppImage`. Make it executable (`chmod +x`) and run it. `.deb` and `.rpm` packages are here too.

            Getting started and everything else: see the [README](https://github.com/friendlylabz/Chummy#readme).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Publish only once every platform has built and uploaded.
  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
