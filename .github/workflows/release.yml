name: Release

# Builds installers for every platform and publishes them as a GitHub
# release. Start it either way:
#   - push a tag like v0.1.0, or
#   - Actions → Release → Run workflow, and type the version (the tag is
#     created on the chosen branch's latest commit).
# The tag sets the version: every build writes it into the app first
# (scripts/set-version.mjs), so the app and its installers always say the
# tag's version, whatever the repository's files say.
# The release stays a draft while building and is published only when every
# platform built. Its notes start with the version's section of
# CHANGELOG.md: without one, the release stops before building anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release (becomes the tag), like v0.1.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # The version from the tag, checked before anything is built: plain
  # MAJOR.MINOR.PATCH (Windows installers refuse anything else).
  version:
    name: Version from the tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        env:
          GIVEN: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/set-version.mjs "$GIVEN"
          v="${GIVEN#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      # What's new: the version's section of CHANGELOG.md. No section, no
      # release (scripts/release-notes.mjs says what to add).
      - id: notes
        name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          node scripts/release-notes.mjs "$TAG" > notes.md
          end="NOTES_$(openssl rand -hex 12)"
          { echo "notes<<$end"; cat notes.md; echo "$end"; } >> "$GITHUB_OUTPUT"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

  # The Python that tools run on, built fresh for every release from
  # python.org's signed source (scripts/build-wasi-python.sh), with a
  # provenance attestation. Every platform's app embeds this one build.
  wasi-python:
    name: Python for WASI
    uses: ./.github/workflows/wasi-python.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      fresh: true
      attest: true

  build:
    name: Build (${{ matrix.name }})
    needs: [version, wasi-python]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS builds run on the Intel runner (Apple Silicon is
          # cross-compiled): GitHub's arm64 macOS runners have been too busy
          # to pick up jobs at all.
          - name: macOS (Apple Silicon)
            os: macos-15-intel
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-15-intel
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          # The oldest supported Ubuntu sets the oldest glibc the AppImage
          # runs on; 22.04 runners are unsupported from April 17, 2027.
          - name: Linux
            os: ubuntu-24.04
            args: ""
            target: ""
          - name: Windows
            os: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tools' Python (embedded in the app)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasi-python
          path: wasi-python

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          if [ -n "${{ matrix.target }}" ]; then rustup target add ${{ matrix.target }}; fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      # Before npm ci and the build, so everything carries the tag's version.
      - name: Version ${{ needs.version.outputs.version }}
        run: node scripts/set-version.mjs "${{ needs.version.outputs.version }}"
      - run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the build rather than ship an app without the tools' Python.
          CHUMMY_REQUIRE_BUNDLED_PYTHON: "1"
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Chummy ${{ needs.version.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            ## What's new

            ${{ needs.version.outputs.notes }}

            ## Downloads

            **Chummy is a heavy work in progress, and 100% vibe-coded.** Expect rough edges.

            Download the file for your computer below:

            - **Windows:** `Chummy_…_x64-setup.exe`. If Windows says it protected your PC, click **More info → Run anyway** (the app isn't signed yet).
            - **Mac with Apple Silicon (M1 and newer):** `Chummy_…_aarch64.dmg`. **Intel Mac:** `Chummy_…_x64.dmg`. Drag Chummy to Applications. The first time, macOS refuses to open it (not notarized yet): go to **System Settings → Privacy & Security** and click **Open Anyway**.
            - **Linux:** `Chummy_…_amd64.AppImage`. Make it executable (`chmod +x`) and run it. `.deb` and `.rpm` packages are here too.

            The Python that tools run on is built from python.org's signed source for this release and included in the app; its build details are in `python-wasi-build-info.txt`.

            Getting started and everything else: see the [README](https://github.com/friendlylabz/Chummy#readme).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Leave the graphics stack to the system: the bundled copies of the
      # libraries Mesa shares crashed WebKitWebProcess on newer systems
      # (scripts/appimage-unbundle-graphics.sh says which and why). tauri-action
      # has already uploaded the AppImage, so this replaces it.
      - name: AppImage without the graphics stack
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
        run: |
          curl -sSfL -o "$APPIMAGETOOL" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $APPIMAGETOOL" | sha256sum -c -
          chmod +x "$APPIMAGETOOL"
          image=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)
          scripts/appimage-unbundle-graphics.sh "$image"
          # The repacked image must still start and hold the app.
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" --self-test
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$image#$(basename "$image")"

      # Apple Silicon kills apps that run JIT code under the hardened runtime
      # without these entitlements ("Code Signature Invalid"; v0.1.0 crashed
      # setting up tools). Both builds must carry them. Only the Intel build
      # can run here (the runner is Intel), so only it runs the self-test.
      - name: macOS JIT entitlements and self-test
        if: runner.os == 'macOS'
        run: |
          triple="${{ matrix.args }}"; triple="${triple#--target }"
          app=$(find "target/$triple/release/bundle/macos" -maxdepth 1 -name '*.app' | head -1)
          echo "Checking $app"
          ents=$(codesign -d --entitlements - --xml "$app")
          echo "$ents" | grep -q allow-jit
          echo "$ents" | grep -q allow-unsigned-executable-memory
          if [ "$triple" = x86_64-apple-darwin ]; then "$app/Contents/MacOS/chummy" --self-test; fi

  # Publish only once every platform has built and uploaded.
  publish:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - name: The tools' Python
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasi-python
          path: wasi-python
      - name: Attach the tools' Python and how it was built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cp wasi-python/build-info.txt python-wasi-build-info.txt
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            wasi-python/python-wasi.zip wasi-python/python-wasi.zip.sha256 python-wasi-build-info.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
