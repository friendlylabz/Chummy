[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
authors = ["Friendly Labs"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

chummy-sandbox = { path = "crates/sandbox" }
chummy-llm = { path = "crates/llm" }
chummy-flow = { path = "crates/flow" }
chummy-tools = { path = "crates/tools" }
chummy-scheduler = { path = "crates/scheduler" }
chummy-store = { path = "crates/store" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Small, fast release binaries.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
