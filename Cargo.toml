[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]
# chummyd is built on request (`cargo build -p chummyd`); CI builds and tests
# the whole workspace, chummyd included.
default-members = [
    "src-tauri",
    "crates/agent",
    "crates/bundle",
    "crates/channel",
    "crates/flow",
    "crates/http",
    "crates/llm",
    "crates/local",
    "crates/log",
    "crates/runner",
    "crates/sandbox",
    "crates/scheduler",
    "crates/session",
    "crates/store",
    "crates/tools",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT"
rust-version = "1.97"
authors = ["friendlylabz"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2", "charset"] }
tempfile = "3"

chummy-sandbox = { path = "crates/sandbox" }
chummy-llm = { path = "crates/llm" }
chummy-flow = { path = "crates/flow" }
chummy-tools = { path = "crates/tools" }
chummy-scheduler = { path = "crates/scheduler" }
chummy-store = { path = "crates/store" }
chummy-local = { path = "crates/local" }
chummy-runner = { path = "crates/runner" }
chummy-log = { path = "crates/log" }
chummy-http = { path = "crates/http" }
chummy-agent = { path = "crates/agent" }
chummy-session = { path = "crates/session" }
chummy-bundle = { path = "crates/bundle" }
chummy-channel = { path = "crates/channel" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Small, fast release binaries.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Compiling the WebAssembly Python is slow with an unoptimized compiler, so
# optimize the compiler even in debug builds.
# Debug info for our own crates only: dependencies' (matrix-sdk's above all)
# would take many gigabytes and slow every build.
[profile.dev.package."*"]
debug = false

# Bundles' Argon2id takes seconds without optimizing.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
