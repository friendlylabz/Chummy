[package]
name = "chummyd"
description = "Runs Chummy agents unattended, as configured in the Chummy app: jobs, and conversations through channels."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "chummyd"
path = "src/main.rs"

[features]
default = ["matrix", "telegram", "discord"]
# The Matrix channel (matrix-sdk with end-to-end encryption and its SQLite
# store, built in so no system SQLite is needed).
matrix = ["chummy-channel/matrix"]
# The Telegram channel (the Bot API over HTTPS).
telegram = ["chummy-channel/telegram"]
# The Discord channel (its web API and Gateway over HTTPS/WebSocket).
discord = ["chummy-channel/discord"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
reqwest.workspace = true
# Time zones built in, so chummyd works without the system's (as in a
# minimal container).
jiff = { version = "1", features = ["tzdb-bundle-always"] }
base64 = "0.23"
chacha20poly1305 = "0.11"
getrandom = "0.4"
zeroize = "1"
rpassword = "7"
chummy-agent.workspace = true
chummy-bundle.workspace = true
chummy-channel.workspace = true
chummy-flow.workspace = true
chummy-http.workspace = true
chummy-llm.workspace = true
chummy-log.workspace = true
chummy-runner.workspace = true
chummy-sandbox.workspace = true
chummy-scheduler.workspace = true
chummy-session.workspace = true
chummy-tools = { workspace = true, features = ["bundled-python"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }

[target.'cfg(windows)'.dependencies]
is_elevated = "0.1"

[dev-dependencies]
tempfile.workspace = true
futures-util.workspace = true
# The test's own Matrix client.
matrix-sdk = { version = "0.20", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "bundled-sqlite", "markdown"] }
mime = "0.3"
# The stand-in Discord's Gateway.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }

# Against a real Synapse (see the test).
[[test]]
name = "matrix"
required-features = ["matrix"]

# Against a stand-in Bot API.
[[test]]
name = "telegram"
required-features = ["telegram"]

# Against a stand-in Discord.
[[test]]
name = "discord"
required-features = ["discord"]

[lints]
workspace = true
