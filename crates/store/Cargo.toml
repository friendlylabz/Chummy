[package]
name = "chummy-store"
description = "Internal persistence for Chummy: the Chummy folder, versioned JSON documents and OS keychain secrets."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
base64 = "0.23"
chacha20poly1305 = "0.11"
getrandom = "0.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize = "1"

keyring-core = "1.1"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
