[package]
name = "chummy-channel"
description = "Channels (chummyd's terminal, Matrix, Telegram): conversations with agents from outside Chummy, the same in the app and chummyd."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[features]
# The Matrix channel (matrix-sdk with end-to-end encryption and its SQLite
# store, built in so no system SQLite is needed).
matrix = ["dep:matrix-sdk", "dep:futures-util"]
# The Telegram channel (the Bot API over HTTPS; no Telegram library).
telegram = ["dep:getrandom"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
jiff = "1"
sha2 = "0.10"
zeroize = "1"
futures-util = { workspace = true, optional = true }
reqwest.workspace = true
getrandom = { version = "0.4", optional = true }
matrix-sdk = { version = "0.20", optional = true, default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "bundled-sqlite", "markdown"] }
chummy-agent.workspace = true
chummy-bundle.workspace = true
chummy-llm.workspace = true
chummy-flow.workspace = true
chummy-http.workspace = true
chummy-log.workspace = true
chummy-scheduler.workspace = true
chummy-session.workspace = true

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
