[package]
name = "chummy"
description = "A minimalist, configurable agent harness."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

# The lib has its own name so it doesn't collide with the binary's .pdb on Windows.
[lib]
name = "chummy_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
iana-time-zone = "0.1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
jiff = "0.2"
getrandom = "0.3"

chummy-local.workspace = true
chummy-sandbox.workspace = true
chummy-llm.workspace = true
chummy-flow.workspace = true
chummy-tools.workspace = true
chummy-scheduler.workspace = true
chummy-runner.workspace = true
chummy-store.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
