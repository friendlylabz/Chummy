# chummyd with Docker Compose, with the agents' folders in a Docker volume.
#
# The easy way: docker/chummyd/chummyd-docker-init asks for the bundle, its
# password and where the agents' folders go, readies the files for
# chummyd's user in the container (65532), and writes this file, set up,
# into a folder of your own. See docs/user/chummyd.md ("In Docker").
#
# By hand: build the image (docker build -f docker/chummyd/Dockerfile -t
# chummyd .), copy this file to a folder of your own, and put beside it
# bundle.chummyd and chummyd_password.txt, both owned by 65532:65532 and
# mode 400. Then, in that folder:
#
#   docker compose up -d
#   docker attach chummyd       # to /verify Matrix sessions or talk to agents
#                               # leave with Ctrl-P Ctrl-Q (Ctrl-C stops chummyd)

services:
  chummyd:
    image: chummyd:latest
    container_name: chummyd
    restart: unless-stopped
    # As little as possible: no root, no capabilities, nothing written
    # outside its two volumes.
    user: "65532:65532"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # chummyd pauses every run when stopped and waits up to 90 seconds
    # (--grace) for them; give it longer than that.
    stop_grace_period: 2m
    # The terminal: for /verify (Matrix) and the terminal channel.
    stdin_open: true
    tty: true
    volumes:
      - ./bundle.chummyd:/bundle/bundle.chummyd:ro
      - jails:/jails
      - state:/state
    secrets: [chummyd_password]
    # chummyd listens on nothing, so there are no ports. Never mount the
    # Docker socket: chummyd doesn't need it.
    #
    # A model on this computer (Ollama, say): use
    # http://host.docker.internal:11434 in the app's connection, and:
    # extra_hosts: ["host.docker.internal:host-gateway"]

secrets:
  chummyd_password:
    file: ./chummyd_password.txt

volumes:
  jails:
  state:
